name: build and push container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: aspectsofyou-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json

      - name: Frontend lint and build
        env:
          NEXT_PUBLIC_DOTNET_API_URL: https://aspectsofyou.datanose.nl
        working-directory: admin/frontend
        run: |
          set -euxo pipefail
          npm ci
          npm run lint
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Backend build
        working-directory: aspectsofyou-endpoint
        run: |
          set -euxo pipefail
          dotnet restore UvA.AspectsOfYou.Endpoint.csproj
          dotnet build UvA.AspectsOfYou.Endpoint.csproj -c Release --no-restore

  build:
    needs: verify
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release version
        run: echo "VERSION=$(date '+0.1.%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Build backend container
        run: |
          set -euxo pipefail
          docker build -f Dockerfile \
            -t "fnwicr.azurecr.io/aspectsofyou-endpoint:${VERSION}" \
            -t "fnwicr.azurecr.io/aspectsofyou-endpoint:latest" \
            .
          docker push "fnwicr.azurecr.io/aspectsofyou-endpoint:${VERSION}"
          docker push "fnwicr.azurecr.io/aspectsofyou-endpoint:latest"
        working-directory: ./aspectsofyou-endpoint

      - name: Build frontend container
        env:
          NEXT_PUBLIC_DOTNET_API_URL: "https://aspectsofyou.datanose.nl"
        run: |
          set -euxo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_DOTNET_API_URL="https://aspectsofyou.datanose.nl" \
            -f Dockerfile \
            -t "fnwicr.azurecr.io/aspectsofyou-frontend:${VERSION}" \
            -t "fnwicr.azurecr.io/aspectsofyou-frontend:latest" \
            .
          docker push "fnwicr.azurecr.io/aspectsofyou-frontend:${VERSION}"
          docker push "fnwicr.azurecr.io/aspectsofyou-frontend:latest"
        working-directory: ./admin/frontend

      - name: Build chart and release
        env:
          UPDATER_SECRET: ${{ secrets.UPDATER_SECRET_K8S }}
        run: |
          set -euxo pipefail
          helm package --version "${VERSION}" --app-version "${VERSION}" charts/aspectsofyou
          helm push "aspectsofyou-${VERSION}.tgz" oci://fnwicr.azurecr.io/helm
          curl "https://k8s.datanose.nl/gitops-updater?name=aspectsofyou&secret=${UPDATER_SECRET}&version=${VERSION}"
