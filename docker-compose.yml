services:

  caddy:
    image: caddy:2-alpine
    ports:
      - "3003:3003"
      - "5059:5059"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - admin-frontend
      - aspectsofyou-endpoint
    networks:
      - forms-network

  admin-frontend:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DOTNET_API_URL: ${NEXT_PUBLIC_DOTNET_API_URL:-https://localhost:5059}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-https://localhost:3003}
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI:-https://localhost:3003}
    expose:
      - "3000"
    depends_on:
      - aspectsofyou-endpoint
    networks:
      - forms-network

  aspectsofyou-endpoint:
    build: ./aspectsofyou-endpoint
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__AspectContext=Host=postgres;Database=aspects;Username=strawberry;Password=strawberry
      - Cors__AllowedOrigins__0=https://localhost:3003
      - Cors__AllowedOrigins__1=https://127.0.0.1:3003
    env_file:
      - .env
    networks:
      - forms-network
      - aspectsofyou-network

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=strawberry
      - POSTGRES_PASSWORD=strawberry
      - POSTGRES_DB=aspects
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aspectsofyou-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strawberry -d aspects"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  forms-network:
    name: forms-network
  aspectsofyou-network:
    name: aspectsofyou-network
