hostname: aspectsofyou.local
ingressClass: nginx

backend:
  image: fnwicr.azurecr.io/aspectsofyou-endpoint
  # Empty tag uses Chart.AppVersion (set by CI when packaging the chart).
  tag: ""
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  env:
    - name: ASPNETCORE_URLS
      value: "http://+:80"
    - name: Cors__AllowedOrigins
      value: "https://aspectsofyou.datanose.nl"
    - name: SurfConext__AdminInviteMemberOf
      value: "urn:mace:surf.nl:invite.surfconext.nl:f97d2c83-6819-4567-a549-35d737304755:datanose_-_aspects_of_you"


frontend:
  image: fnwicr.azurecr.io/aspectsofyou-frontend
  tag: ""
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

azure:
  enabled: false
  keyvaultName: keyvaultName
  resourceGroup: resourceGroupName
  subscriptionId: subscriptionId
  tenantId: tenantId
  clientId: clientId
  identityName: identityName
  secrets:
    - name: "aspectsofyou-surfconext-secret"
      key: SurfConext__ClientSecret
    - name: "aspectsofyou-connectionstring"
      key: ConnectionStrings__AspectContext